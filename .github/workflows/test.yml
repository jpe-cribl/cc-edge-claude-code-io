name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Skip on the template repo itself; consumer repos have is_template: false.
    if: github.event.repository.is_template == false
    uses: jpe-cribl/.github/.github/workflows/cribl-pack-validate.yml@740c35be626ea458281111e1c1b8497d283b1c04 # main
    with:
      # CHANGE per pack: 'edge' for Cribl Edge packs, 'stream' for Cribl Stream packs.
      pack_type: edge

  pack-tests:
    # Always reports on every PR, so rulesets can require it.
    name: Pack tests
    needs: test
    if: always()
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
      - name: Require the pack test jobs to pass
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success
